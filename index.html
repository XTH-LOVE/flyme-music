<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/aurora-mark.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)" />
    <title>Aurora Music</title>
    <!-- Warm the netease art CDN early: the first cover on each host otherwise
         pays DNS + TLS (~0.1-0.5s on domestic links) right when the user is
         staring at a gradient. Four hosts, no crossorigin: matches the plain
         <img> loads that make up the vast majority of cover requests. -->
    <link rel="preconnect" href="https://p1.music.126.net" />
    <link rel="preconnect" href="https://p2.music.126.net" />
    <link rel="preconnect" href="https://p3.music.126.net" />
    <link rel="preconnect" href="https://p4.music.126.net" />
  </head>
  <body>
    <script>
      // Apply persisted theme before first paint to avoid flashing.
      (function () {
        try {
          var mode = localStorage.getItem('aurora.theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
