[package]
name = "app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] } # 不开 unsafe-headers 时 Rust 会丢弃 Referer/Origin/Cookie，QQ 接口与图片防盗链会静默 403
tauri-plugin-dialog = "2"
base64 = "0.22"
lofty = "0.22.2"
aes = "0.8.4"
tauri-plugin-opener = "2.5.5"

# Desktop-only: F11 fullscreen toggle (mobile has no need for it).
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
