# Permissions for the `media` plugin.
#
# The plugin's commands are invoked from JavaScript, so they pass through
# Tauri's ACL. Tauri's own Android plugins (AppPlugin, PathPlugin) never needed
# this because they are only ever called from Rust, where the ACL does not
# apply - which is why an inline plugin looks like it should work and then
# rejects every call from the page.
#
# Without this, the invoke rejects, the JS catch swallows it, and the
# notification never appears with nothing anywhere to say why.

[default]
description = "Publish now-playing metadata and receive transport actions."
permissions = [
  "allow-update-now-playing",
  "allow-set-playing",
  "allow-clear",
  "allow-register-listener",
  "allow-remove-listener",
]

[[permission]]
identifier = "allow-update-now-playing"
description = "Publish the current track's metadata to the notification."
commands.allow = ["updateNowPlaying"]

[[permission]]
identifier = "allow-set-playing"
description = "Publish the current play/pause state."
commands.allow = ["setPlaying"]

[[permission]]
identifier = "allow-clear"
description = "Remove the notification when playback stops."
commands.allow = ["clear"]

# registerListener and removeListener are declared by Tauri's own Plugin base
# class, but addPluginListener calls them through the same ACL as everything
# else, so they have to be listed too or the transport buttons arrive nowhere.
[[permission]]
identifier = "allow-register-listener"
description = "Subscribe to transport button presses."
commands.allow = ["registerListener"]

[[permission]]
identifier = "allow-remove-listener"
description = "Unsubscribe from transport button presses."
commands.allow = ["removeListener"]
